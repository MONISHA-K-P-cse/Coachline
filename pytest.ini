[pytest]
# The tests/ai/agents/test_client.py, test_resume_agent.py, test_eval.py,
# test_notes.py, test_roadmap.py, test_interview.py and tests/ai/graph/
# test_orchestrator.py and tests/ai/rag/test_retriever.py scripts are manual
# smoke-test scripts with no assertions - they print raw output from a live
# LLM call and are meant to be run individually (e.g. `python -m
# tests.ai.agents.test_eval` from the repo root) against a running
# Ollama/watsonx backend, not collected automatically. Restrict default
# collection to the real assertion-based suites so `pytest` doesn't hang
# dialing out to a model server that isn't running in CI.
testpaths =
    test_backend.py
    tests/ai/agents/test_structured_agents.py
    tests/ai/agents/test_granite_client.py
